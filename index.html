<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linux и Python за 4 дня — тренажёр под собеседование QA</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f9d8f'/><text y='70' x='50' font-size='52' text-anchor='middle' font-family='monospace' font-weight='bold' fill='%23041a18'>&gt;_</text></svg>">
<link rel="stylesheet" href="css/style.css?v=20260817a">
<script>
  try {
    var t = localStorage.getItem('qa-course-theme');
    if (t && t !== 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* приватный режим */ }
</script>
</head>
<body>

<header class="top">
  <button class="icon-btn only-mobile" id="btn-menu" title="Список уроков">☰</button>

  <div class="brand">
    <div class="logo">&gt;_</div>
    <div class="brand-text">
      Linux и Python за 4 дня
      <small>тренажёр под собеседование QA ядра сети</small>
    </div>
  </div>

  <div class="top-progress">
    <div class="bar"><i id="bar-fill"></i></div>
    <span id="prog-label">0 из 0</span>
  </div>

  <div class="mobile-tabs only-mobile">
    <button class="icon-btn active" id="m-theory">Теория</button>
    <button class="icon-btn" id="m-work">Практика</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="xp">0</b><span>XP</span></div>
    <button class="icon-btn" id="btn-theme" title="Светлая / тёмная тема">◐</button>
    <button class="icon-btn" id="btn-exam" title="Режим собеседования">🎯</button>
    <button class="icon-btn" id="btn-reset" title="Сбросить прогресс">⟲</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <section class="pane pane-mid show" id="pane-mid">
    <div class="lesson-head">
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <div class="goal" id="goal"></div>
    </div>

    <div class="theory" id="theory"></div>

    <div class="task-card">
      <h3>▶ Задание</h3>
      <div id="task-text"></div>
      <div class="task-actions">
        <button class="btn btn-check" id="btn-check">Проверить</button>
        <button class="btn btn-ghost" id="btn-hint">Подсказка</button>
        <button class="btn btn-ghost" id="btn-solution">Решение</button>
      </div>
      <div class="verdict" id="verdict"></div>
      <div class="hints" id="hints"></div>
    </div>

    <div class="quiz" id="quiz"></div>

    <div class="nav-row">
      <button class="btn btn-ghost" id="btn-prev">← Назад</button>
      <button class="btn btn-ghost" id="btn-next">Вперёд →</button>
    </div>
  </section>

  <section class="pane pane-work" id="pane-work">
    <div class="work-head">
      <div class="work-tabs">
        <button class="wtab active" id="wt-main">Практика</button>
        <button class="wtab" id="wt-cheat">Шпаргалка</button>
      </div>
      <div class="work-tools" id="work-tools"></div>
    </div>

    <!-- консоль Linux -->
    <div class="work-body" id="shell-view" hidden>
      <div class="stand-line" id="stand-line"></div>
      <div class="term" id="term" tabindex="0">
        <div class="term-out" id="term-out"></div>
        <div class="term-input-row">
          <span class="prompt" id="term-prompt">qa@core-node:~$</span>
          <input class="term-input" id="term-input" spellcheck="false" autocomplete="off" autocapitalize="off">
        </div>
      </div>
      <!-- быстрые вставки: набирать длинные пути на телефоне невозможно -->
      <div class="quick-keys" id="term-keys"></div>
    </div>

    <!-- редактор Python -->
    <div class="work-body" id="py-view" hidden>
      <div class="editor-wrap">
        <div class="editor-gutter" id="gutter"></div>
        <textarea class="editor" id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
      <div class="quick-keys" id="py-keys"></div>
      <div class="run-row">
        <button class="btn btn-run" id="btn-run">▶ Запустить (Ctrl+Enter)</button>
        <button class="btn btn-ghost" id="btn-pytest">Прогнать pytest</button>
        <button class="btn btn-ghost" id="btn-reset-code">Сбросить код</button>
      </div>
      <pre class="output" id="py-out"></pre>
    </div>

    <!-- шпаргалка -->
    <div class="work-body cheat" id="cheat-view" hidden></div>
  </section>
</div>

<div class="modal-back" id="exam-back" hidden>
  <div class="modal" id="exam-modal"></div>
</div>

<script src="js/shell/stand.js?v=20260817a"></script>
<script src="js/shell/shell.js?v=20260817a"></script>
<script src="js/py/lexer.js?v=20260817a"></script>
<script src="js/py/parser.js?v=20260817a"></script>
<script src="js/py/interp.js?v=20260817a"></script>
<script src="js/py/builtins.js?v=20260817a"></script>
<script src="js/py/stdlib.js?v=20260817a"></script>
<script src="js/engine.js?v=20260817a"></script>
<script src="js/content/lessons-linux.js?v=20260817a"></script>
<script src="js/content/lessons-linux2.js?v=20260817a"></script>
<script src="js/content/lessons-python.js?v=20260817a"></script>
<script src="js/content/lessons-pytest.js?v=20260817a"></script>
<script src="js/content/cheatsheet.js?v=20260817a"></script>
<script src="js/content/exam.js?v=20260817a"></script>
<script src="js/ui/terminal.js?v=20260817a"></script>
<script src="js/ui/editor.js?v=20260817a"></script>
<script src="js/app.js?v=20260817a"></script>
</body>
</html>
